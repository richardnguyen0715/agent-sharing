# Usage: docker compose -f docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: termhub-postgres
    environment:
      POSTGRES_USER: termhub
      POSTGRES_PASSWORD: termhub
      POSTGRES_DB: termhub
    ports:
      - "5432:5432"
    volumes:
      - termhub-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U termhub"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: termhub-redis
    ports:
      - "6379:6379"
    volumes:
      - termhub-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  termhub-pgdata:
  termhub-redis:
