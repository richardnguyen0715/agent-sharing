services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: termhub-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: termhub-backend
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://termhub:termhub@postgres:5432/termhub?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-a-long-random-string}
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 168h
      CORS_ORIGINS: http://localhost:3000
      LOG_LEVEL: info
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - termhub-recordings:/app/recordings
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: termhub-postgres
    environment:
      POSTGRES_USER: termhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-termhub}
      POSTGRES_DB: termhub
    ports:
      - "5432:5432"
    volumes:
      - termhub-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U termhub"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: termhub-redis
    ports:
      - "6379:6379"
    volumes:
      - termhub-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  termhub-pgdata:
  termhub-redis:
  termhub-recordings:
